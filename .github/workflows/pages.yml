name: Curate & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * *" # 毎日 22:30 UTC = 07:30 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect feeds & curate incidents
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/collect.py
          python3 scripts/curate.py

      - name: Build static site
        run: python3 scripts/build.py

      - name: Commit updates
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/incidents.json index.html incidents; then
            echo "変更なし"
            exit 0
          fi
          git add data/incidents.json data/skipped.json index.html incidents
          git commit -m "content: update incidents ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets incidents data _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # デプロイは artifact のメタデータ反映待ちで一時的に失敗することがある
      # （"No artifacts named github-pages" / "Fetching artifact metadata failed"）。
      # 待機を挟んで最大 3 回まで試す。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry (1)
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy (1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry (2)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        run: sleep 90

      - name: Retry deploy (2)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Fail if all deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure' && steps.deployment_retry2.outcome == 'failure'
        run: |
          echo "::error::Pages へのデプロイが 3 回とも失敗しました。"
          exit 1
